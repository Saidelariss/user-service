spring.application.name: user-service
spring:
  datasource:
    url: jdbc:h2:file:../userdb/userdb
    driver-class-name:  org.h2.Driver
    username: sa
    password:
  liquibase:
    change-log: classpath:liquibase/db.changelog-master.xml
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    org.springframework.security: TRACE
